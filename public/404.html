<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sathya Vamshi Mittakori | Portfolio</title>
    <script>
      // GitHub Pages SPA redirect: rewrite deep links to the hash route on /.
      var path = window.location.pathname;
      var segs = path.split("/").filter(Boolean);
      var base = segs.length ? "/" + segs[0] + "/" : "/";
      window.location.replace(base);
    </script>
  </head>
  <body></body>
</html>
